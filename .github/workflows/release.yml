name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries and archive them
        run: |
          set -euo pipefail
          mkdir -p dist

          VERSION="${{ steps.get_version.outputs.VERSION }}"

          build_cli() {
            local os="$1"
            local arch="$2"
            local ext="$3"

            local bin="goweeb${ext}"
            GOOS="${os}" GOARCH="${arch}" go build -ldflags="-s -w" -o "${bin}" ./cmd/goweeb-cli

            if [ "${os}" = "windows" ]; then
              zip "dist/goweeb-${VERSION}-${os}-${arch}.zip" "${bin}"
            else
              tar -czvf "dist/goweeb-${VERSION}-${os}-${arch}.tar.gz" "${bin}"
            fi

            rm "${bin}"
          }

          build_tui() {
            local os="$1"
            local arch="$2"
            local ext="$3"

            local bin="goweeb-tui${ext}"
            GOOS="${os}" GOARCH="${arch}" go build -ldflags="-s -w" -o "${bin}" ./cmd/goweeb-tui

            if [ "${os}" = "windows" ]; then
              zip "dist/goweeb-tui-${VERSION}-${os}-${arch}.zip" "${bin}"
            else
              tar -czvf "dist/goweeb-tui-${VERSION}-${os}-${arch}.tar.gz" "${bin}"
            fi

            rm "${bin}"
          }

          # CLI
          build_cli linux amd64 ""
          build_cli windows amd64 ".exe"
          build_cli darwin amd64 ""
          build_cli darwin arm64 ""

          # TUI
          build_tui linux amd64 ""
          build_tui windows amd64 ".exe"
          build_tui darwin amd64 ""
          build_tui darwin arm64 ""

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
