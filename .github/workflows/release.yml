name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          mkdir -p builds
          
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o builds/scan-scraper-${{ steps.get_version.outputs.VERSION }}-linux-amd64 ./cmd/main.go
          
          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o builds/scan-scraper-${{ steps.get_version.outputs.VERSION }}-windows-amd64.exe ./cmd/main.go
          
          # macOS AMD64
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o builds/scan-scraper-${{ steps.get_version.outputs.VERSION }}-darwin-amd64 ./cmd/main.go
          
          # macOS ARM64
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o builds/scan-scraper-${{ steps.get_version.outputs.VERSION }}-darwin-arm64 ./cmd/main.go

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: builds/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
